[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "controlmesh"
version = "0.44.0"
description = "Small, explicit task execution, verification and handoff tools for existing agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "muqiao215" }]
keywords = ["controlmesh", "agent", "workflow", "verification", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "ruff>=0.15.0"]

[project.urls]
Homepage = "https://github.com/qiaoqiao2521/ControlMesh"
Repository = "https://github.com/qiaoqiao2521/ControlMesh"
Documentation = "https://github.com/qiaoqiao2521/ControlMesh/blob/main/docs/README.md"
Issues = "https://github.com/qiaoqiao2521/ControlMesh/issues"

[project.scripts]
controlmesh = "controlmesh.__main__:main"
cm = "controlmesh.__main__:main"
cm-closeout = "controlmesh.closeout:main"
cm-workflow = "controlmesh.workflow:main"

[tool.hatch.build.targets.wheel]
packages = ["controlmesh"]

[tool.hatch.build.targets.sdist]
include = ["controlmesh/", "LICENSE", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", ".ci-specmesh-workflow"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
