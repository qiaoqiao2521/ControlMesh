name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  UV_VERSION: "0.11.7"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .

  test:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: ${{ github.workspace }}/vendor/codex_callback/runtime
      CM_SPECMESH_TEST_ROOT: ${{ github.workspace }}/.ci-specmesh-workflow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout independent SpecMesh handoff contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qiaoqiao2521/specmesh
          ref: 1e19bdf8093b57326cbadfa7cd9026b033c000ba
          path: .ci-specmesh-workflow
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute and verify without site packages
        run: |
          python -B -S -m unittest discover -s tests/execution -v
          python -B -S -m unittest discover -s tests/workflow -v
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - name: Retained tools and callback regressions
        run: uv run --frozen pytest -q tests vendor/codex_callback/tests/test_callback.py::DeliveryTests

  build:
    name: Build and installed command smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      - name: Install wheel without dependencies and run real tasks
        run: python scripts/check_package.py

  companion-store:
    name: Optional companion memory store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test the independent store without model or SDK dependencies
        run: node --test plugins/dsh-companion-memory/test/store.test.js

  ci-success:
    name: CI success
    if: ${{ always() && !cancelled() }}
    needs: [ruff, test, build, companion-store]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the retained product passed
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          gates = json.loads(os.environ["GATE_RESULTS"])
          failures = {name: gate["result"] for name, gate in gates.items() if gate["result"] != "success"}
          if not gates or failures:
              print(f"Required CI gates did not pass: {failures or 'no results'}")
              sys.exit(1)
          print("All retained ControlMesh gates passed.")
          PY
